  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:#3b4664;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:16px;
  }

  /* ===== 主視窗（v1 尺寸） ===== */
  .window{
    width:1295px; height:auto;
    background:var(--panel);
    border:4px solid var(--ink);
    border-radius:14px;
    padding:14px 18px 18px;
    position:relative;
    box-shadow:0 14px 40px rgba(0,0,0,.4);
    display:flex; flex-direction:column;
  }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .titlebar h1{ font-size:32px; letter-spacing:8px; color:#111; flex:1; text-align:center; }
  .icon-btn{
    flex:none;
    width:36px; height:36px; border-radius:9px; border:3px solid var(--ink);
    font-size:18px; font-weight:bold; cursor:pointer; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.info{ background:linear-gradient(180deg,#3b6fd8,#20315e); font-style:italic; font-family:Georgia,serif; }
  .icon-btn.close{ background:linear-gradient(180deg,#e04b6f,#8f1d3a); }
  .icon-btn:hover{ filter:brightness(1.15); }

  /* ===== 每日任務區 ===== */
  .tasks-wrap{
    background:var(--pink);
    border:3px solid var(--ink);
    border-radius:12px;
    padding:8px 12px 16px;
    margin-top:8px;
  }
  /* 三格卡片；卡片內部：EXP 標籤置右上、說明左對齊、進度條與按鈕滿寬 */
  .tasks{
    padding:0;
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    align-content:start;
  }
  /* ===== 票券樣式：左邊票根放 EXP，右邊放任務內容 ===== */
  .task{
    background:#faf6ec;
    border:2px solid #8a8ea0;
    border-radius:12px;
    padding:0;
    color:#111; position:relative;
    display:grid; grid-template-columns:var(--stub-w) 1fr;
    align-items:stretch; gap:0;
  }
  /* 撕線上下的齒孔 */
  .task::before,
  .task::after{
    content:""; position:absolute; left:var(--stub-w);
    width:14px; height:14px; border-radius:50%;
    background:var(--pink);
    transform:translateX(-50%); z-index:3;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  }
  .task::before{ top:-8px; }
  .task::after{ bottom:-8px; }
  .task-main{
    display:flex; flex-direction:column; gap:8px; min-width:0;
    padding:10px 12px 12px;
  }
  .task .desc{
    font-size:21px; font-weight:bold;
    height:auto; min-height:58px;
    word-break:keep-all;             /* 只在空白處換行，不切斷詞 */
    display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.35; letter-spacing:1px;
  }
  .task .bar-row{ display:flex; align-items:center; gap:8px; width:100%; }
  .task .bar{
    flex:1; height:24px; border-radius:12px;
    background:#3d5a80; border:2px solid #2b4360;
    position:relative; overflow:hidden;
  }
  .task .bar .fill{
    position:absolute; inset:0; width:0%;
    background:linear-gradient(180deg,#b7f36b,#4fae1d);
    transition:width .35s;
  }
  .task .bar .txt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:bold; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .task .gem{
    width:auto; height:100%; padding:0; min-width:0;
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#b681e4,#7844ae);
    border-radius:10px 0 0 10px;
    border-right:2px dashed rgba(255,255,255,.8);   /* 撕線 */
    color:#fff; white-space:nowrap;
    font-size:32px; font-weight:bold; line-height:1;
    text-shadow:0 2px 3px rgba(0,0,0,.45);
  }
  .task .gem .unit{
    display:block; font-size:15px; letter-spacing:2px;
    margin:4px 0 0; opacity:.95; text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .task .go{
    align-self:center; width:auto; min-width:150px;
    background:linear-gradient(180deg,#5ecb3a,#1f7d1f);
    border:2px solid #0d4a0d; border-radius:6px;
    color:#fff; font-size:17px; font-weight:bold; letter-spacing:3px;
    padding:5px 26px; cursor:pointer;
    text-shadow:0 1px 2px #000;
  }
  .task .go:hover{ filter:brightness(1.12); }
  .task .go.claim{ background:linear-gradient(180deg,#ffd84d,#d18d00); border-color:#7a5200; animation:pulse 1s infinite; }
  .task .go.done{ background:#555; border-color:#333; cursor:default; animation:none; }
  @keyframes pulse{ 50%{ transform:scale(1.06); } }

  /* ===== 通行證標頭 ===== */
  .pass-head{
    display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; margin:0 4px 10px; gap:10px;
  }
  .exp-wrap{ display:flex; align-items:center; gap:8px; max-width:400px; }
  .lv-badge{
    background:linear-gradient(180deg,#ffd84d,#e0a400);
    color:#5a3d00; font-weight:bold; font-size:24px; letter-spacing:1px;
    padding:5px 14px; border-radius:14px; border:2px solid #b07d00;
    white-space:nowrap; z-index:1; box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .lv-badge.bump{ animation:lvPop .4s ease; }
  @keyframes lvPop{ 0%{transform:scale(1);} 45%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .exp-tag{
    background:var(--node); color:#fff; font-weight:bold; font-size:22px;
    padding:5px 14px; border-radius:14px; z-index:1; white-space:nowrap;
  }
  .exp-bar{
    flex:1; height:10px; background:#c9d4de; border-radius:5px;
    margin:0 -8px; position:relative; overflow:hidden;
  }
  .exp-bar .fill{ position:absolute; inset:0; width:0%; background:var(--node); transition:width .4s; }
  .exp-val{
    background:var(--node); color:#fff; font-weight:bold; font-size:22px;
    padding:5px 16px; border-radius:14px; z-index:1; white-space:nowrap;
  }
  .pass-title{ font-size:38px; font-weight:bold; letter-spacing:4px; }
  .deadline{ text-align:right; font-size:20px; font-weight:bold; }
  .deadline .count{ color:#c0392b; font-size:17px; display:block; margin-top:2px; }

  /* =========================================================
     主體排版：整片連在一起，只用「底色」區分免費／豪華
     [免費/豪華標籤] [ 1~50 階可滑動，里程碑階同時排在軌道上 ] [ 下一個里程碑固定 ]
     ========================================================= */
  .pass-body{
    display:grid;
    grid-template-columns:120px 1fr var(--next-w);
    gap:0;                       /* 不留縫，整片連續 */
    position:relative;
    border:3px solid var(--ink);
    border-radius:12px;
    overflow:hidden;             /* 讓底色貼齊圓角外框 */
    background:var(--rail-bg);
  }
  /* 階段條底線：壓在免費／豪華交界的顏色上面，貫穿整片 */
  .pass-body::after{
    content:""; position:absolute; left:0; right:var(--next-w);
    top:calc(var(--row-free) - 4px);
    height:8px; background:var(--node); z-index:3;
  }

  .col{ display:flex; flex-direction:column; position:relative; }
  .track > .col{ flex:0 0 var(--col-w); }
  /* 里程碑階（每 10 階）：寬度與底色都與一般階相同 */

  /* 免費／豪華兩條連續色帶（無框線、無間距） */
  .cell-free{
    background:var(--free-bg);
    border:0; border-radius:0;
    height:var(--row-free);
    display:flex; align-items:center; justify-content:center; gap:5px;
    padding:5px 5px var(--mid-gap);   /* 下方讓位給階段條 */
  }
  .cell-lux{
    background:var(--lux-bg);
    border:0; border-radius:0;
    height:var(--row-lux);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--slot-gap);
    padding:var(--mid-gap) 5px 5px;
  }
  /* 每階之間的短分隔線 */
  .track .col .cell-free,
  .track .col .cell-lux{ position:relative; }
  .track .col:not(:last-child) .cell-free::after,
  .track .col:not(:last-child) .cell-lux::after{
    content:""; position:absolute; right:0; width:2px; z-index:0;
  }
  /* 兩端用漸層淡出，避免線頭太明顯 */
  .track .col:not(:last-child) .cell-free::after{
    top:12%; bottom:12%;
    background:linear-gradient(180deg,
      rgba(20,38,78,0) 0%, rgba(20,38,78,.24) 32%,
      rgba(20,38,78,.24) 68%, rgba(20,38,78,0) 100%);
  }
  .track .col:not(:last-child) .cell-lux::after{
    top:9%; bottom:9%;
    background:linear-gradient(180deg,
      rgba(126,58,0,0) 0%, rgba(126,58,0,.24) 30%,
      rgba(126,58,0,.24) 70%, rgba(126,58,0,0) 100%);
  }

  .label-cell{ font-size:25px; font-weight:bold; letter-spacing:3px; color:#12213c; }
  /* ----- 標籤欄：徽章 + 名稱 + 解鎖狀態 ----- */
  .label-col .cell-free{ flex-direction:column; gap:6px; padding:6px 4px var(--mid-gap); }
  .label-col .cell-lux{ flex-direction:column; gap:9px; padding:var(--mid-gap) 4px 6px; }
  /* 徽章：直接用正式素材圖（文字已在圖上） */
  .badge{
    flex:none; background-repeat:no-repeat; background-position:center;
    background-size:contain;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.42));
  }
  .badge.silver{ background-image:var(--img-free); width:78px;  height:89px; }
  .badge.gold  { background-image:var(--img-lux);  width:112px; height:96px; }
  /* 已購買：豪華徽章加金光 */
  .label-col.unlocked .badge.gold{
    box-shadow:0 0 10px 3px rgba(255,203,60,.85), 0 2px 5px rgba(0,0,0,.35);
  }
  /* 標籤欄：同色系再加深一階，靠顏色切割，不用線條 */
  .label-col .cell-free{ background:var(--free-bg-3); }
  .label-col .cell-lux{ background:var(--lux-bg-3); }

  /* ----- 中間捲動區（手機式滑動：無捲軸、可拖曳） ----- */
  .track-scroll{
    overflow-x:auto; overflow-y:hidden;
    position:relative;
    cursor:grab;
    -webkit-overflow-scrolling:touch;   /* iOS 慣性滑動 */
    scrollbar-width:none;               /* Firefox 隱藏捲軸 */
    touch-action:pan-x;                 /* 觸控只允許橫向 */
  }
  .track-scroll::-webkit-scrollbar{ display:none; } /* Chrome/Safari 隱藏捲軸 */
  .track-scroll.dragging{ cursor:grabbing; }
  .track-scroll.dragging *{ pointer-events:none; }  /* 拖曳中不誤觸獎勵 */
  .track{
    display:flex;
    display:flex;                     /* 改 flex 讓里程碑欄可單獨加寬 */
    gap:0;
    position:relative;
    width:max-content;
  }
  /* 等級階段條：位於免費／豪華中間，浮在色塊之上 */
  .rail{
    position:absolute; left:0; right:0;
    top:calc(var(--row-free) - 4px);
    height:8px; background:var(--node);
    z-index:4;
  }
  .rail-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:#ffb400;
    width:0%; transition:width .5s;
  }
  .node{
    position:absolute; left:50%; transform:translateX(-50%);
    top:calc(var(--row-free) - 14px);
    width:52px; height:32px; border-radius:16px;
    background:var(--node); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:21px; z-index:5;
    border:2px solid #0c6f9c;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    transition:.3s;
  }
  .node.reached{ background:#ffb400; border-color:#8a5f00; color:#3a2800; }

  /* 獎勵格：貼齊區塊、寬度收窄成近正方形 */
  .reward{
    width:100%; max-width:var(--tile-w); height:100%; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:13px; font-weight:bold; color:#333;
    border:2px solid transparent;
    position:relative; cursor:pointer; user-select:none;
    transition:.15s; text-align:center; line-height:1.2;
    overflow:visible;              /* 讓鎖頭／勾勾可以稍微凸出格子外 */
  }
  .cell-lux .reward{ flex:1 1 0; min-height:0; }
  /* 獎勵內容：圖示 + 名稱 + 數量 */
  .r-ico{ font-size:26px; line-height:1; }
  .r-img{
    display:block; width:auto; max-width:87%; max-height:87%;
    margin:auto;                     /* 圖示在格子內置中，四周留點呼吸 */
    object-fit:contain;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)) drop-shadow(0 0 1px rgba(0,0,0,.4));
  }
  .r-name{ font-size:13px; }
  /* 數量：疊在圖示上（貼底置中），不再佔用圖的空間 */
  .r-amt{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    z-index:2;
    font-size:20px; font-weight:bold; letter-spacing:0; line-height:1.3;
    padding:0 6px; border-radius:7px;
    background:rgba(0,0,0,.55); color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.95);
    max-width:112px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* 該階段沒有獎勵的空格：只留底色 */
  .reward.empty{
    background:transparent; border:0;
    cursor:default; pointer-events:none;
  }
  .cell-lux .reward.empty{ flex:1 1 0; min-height:0; }
  /* 銅幣是斜視的扁橢圓，等寬時視覺比星幣小，稍微放大補回來 */
  .r-img[data-id="銅幣"]{ transform:scale(1.12); }
  .reward.free{ background:var(--reward-free); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .reward.lux{ background:var(--reward-lux); }
  .reward.locked::after{
    content:""; position:absolute; top:-5px; right:-5px;
    width:30px; height:30px;
    background:var(--lock-img) center/contain no-repeat;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
    z-index:3;
  }
  /* 可領取：不用紅點，用閃爍的外框提示 */
  .reward.claimable{ animation:claimBlink 1s ease-in-out infinite; }
  @keyframes claimBlink{
    0%,100%{
      border-color:rgba(255,255,255,.35);
      box-shadow:0 0 0 0 rgba(255,255,255,0), 0 0 0 0 rgba(255,170,0,0);
    }
    50%{
      border-color:#ffffff;
      box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 0 9px 2px rgba(255,168,0,.9);
    }
  }
  .reward.claimed{ filter:saturate(.6) brightness(.92); cursor:default; }
  .reward.claimed::after{
    content:"✔"; position:absolute; top:-5px; right:-5px;
    width:24px; height:24px; border-radius:50%;
    background:#2fa53c; border:2px solid #fff; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:bold; z-index:3; box-shadow:0 1px 4px rgba(0,0,0,.4);
  }

  /* ----- 右方大獎欄（固定）：同色系加深一階，靠顏色區分里程碑 ----- */
  .big-col{
    position:relative;
    border-left:3px solid var(--ink);          /* 與通行證盤面分隔 */
    box-shadow:-7px 0 14px rgba(20,28,50,.30);
    z-index:6;
  }
  /* 只有最右側固定欄保留放大展示的樣子 */
  .big-col .reward,
  .big-col .reward.wheel-free,
  .big-col .reward.wheel-lux{ max-width:var(--tile-next-w); }
  .big-col .cell-free{ background:var(--free-bg); padding:5px 6px var(--mid-gap); }
  .big-col .cell-lux{
    background:var(--lux-bg); padding:var(--mid-gap) 8px 8px;
    justify-content:flex-start; gap:10px;
  }
  .big-col .reward.wheel-lux{ flex:0 0 auto; height:108px; }
  /* 右側欄的宣傳文案：做成一塊小告示牌 */
  .ad-copy{
    align-self:stretch;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 4px 8px;
    background:linear-gradient(180deg,#6a3105,#3f1c02);
    border:2px solid #ffce6a;
    border-radius:11px;
    box-shadow:0 3px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.22);
    text-align:center; white-space:nowrap; overflow:hidden;
  }
  .ad-copy .l1{
    font-size:21px; font-weight:bold; letter-spacing:1px;
    color:#ffe6b0; text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .ad-copy .l2{
    font-size:21px; font-weight:bold; letter-spacing:0;
    color:#fff3cf; text-shadow:0 1px 2px rgba(0,0,0,.85);
  }
  .ad-copy .l2 b{
    color:#ffd23f;
    text-shadow:0 1px 2px rgba(0,0,0,.95), 0 0 8px rgba(255,190,40,.6);
  }
  .reward.wheel-free,
  .reward.wheel-lux{
    width:100%; max-width:var(--tile-w); height:100%;
  }
  /* 免費的轉盤格：底色跟其他免費格一樣的藍 */
  .reward.wheel-free{ background:var(--reward-free); color:#fff; }
  /* 豪華的轉盤格：底色跟其他豪華格一樣的黃 */
  .reward.wheel-lux{ background:var(--reward-lux); color:#333; text-shadow:none; }
  /* 轉盤圖是橫幅的，讓它用滿格子寬度（只針對轉盤品項，其他品項維持統一尺寸） */
  .r-img[data-id="普通轉盤"],
  .r-img[data-id="豪華轉盤"]{ max-width:100%; max-height:100%; }
  .reward.wheel-free,
  .reward.wheel-lux{ overflow:visible; }
  /* 通行證版面（軌道）上的轉盤：用 transform 放大，不影響排版所以能維持置中 */
  .track .r-img[data-id="普通轉盤"],
  .track .r-img[data-id="豪華轉盤"]{
    transform:scale(1.3); transform-origin:center center;
  }
  /* 大獎欄等級節點（同樣壓在中線上） */
  .big-node{
    position:absolute; left:50%; transform:translateX(-50%);
    top:calc(var(--row-free) - 14px);
    width:58px; height:32px; border-radius:16px;
    background:var(--node); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:20px; z-index:5;
    border:2px solid #0c6f9c;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .big-node.reached{ background:#ffb400; border-color:#8a5f00; color:#3a2800; }

  /* 標籤欄的軌道起點（已由 .pass-body::before 貫穿，不再需要） */
  .stub-node{ display:none; }

  /* ===== 通行證獎勵區底色 ===== */
  .pass-wrap{
    background:#cfdff2;
    border:3px solid var(--ink);
    border-radius:12px;
    padding:10px 8px;
    margin:0;
  }

  /* ===== 每日任務區塊標題 ===== */
  .section-title{
    font-size:25px; font-weight:bold; letter-spacing:4px;
    margin:2px 0 8px; color:#111; text-align:center;
  }

  /* ===== 底部按鈕 ===== */
  .footer{
    display:flex; justify-content:space-between; align-items:center;
    gap:16px; margin:10px 0 2px; padding:0 10px;
  }
  .btn{
    flex:1; max-width:300px;
    border:3px solid var(--ink); border-radius:24px;
    font-size:23px; font-weight:bold; letter-spacing:3px;
    padding:12px 0; cursor:pointer; position:relative;
    transition:.15s;
  }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.06); }
  .btn-buy{ background:linear-gradient(180deg,#7be07b,#35b04a); color:#0c3a12; }
  .btn-buy .up{
    position:absolute; right:-84px; bottom:6px;
    width:140px; height:48px; padding:0;
    background:var(--img-up) center/contain no-repeat;
    border-radius:0; box-shadow:none; text-indent:-9999px; overflow:hidden;
    transform:none;
    filter:drop-shadow(2px 3px 4px rgba(0,0,0,.35));
    animation:upBlink 1.1s ease-in-out infinite;
  }
  @keyframes upBlink{
    0%,100%{ transform:scale(1);    filter:brightness(1); }
    50%    { transform:scale(1.10); filter:brightness(1.35); }
  }
  .btn-buy.owned .up{ animation:none; filter:grayscale(1); }
  .btn-buy.owned{ background:#c9c9c9; color:#666; cursor:default; }
  .btn-claimall{ background:linear-gradient(180deg,#9fe6ff,#42c2ec); color:#083a4d; }
  .btn-reset{ background:linear-gradient(180deg,#fce1f2,#f3aede); color:#5a1244; }

  /* ===== 轉盤大版面（參考遊戲內轉盤） ===== */
  .wheel-stage{
    --wsz:470px;
    position:relative; border-radius:14px; padding:16px 18px 12px;
    background:radial-gradient(125% 100% at 50% 0%, #7a4416 0%, #43220d 45%, #23120a 100%);
    border:3px solid #180f07;
    box-shadow:inset 0 0 70px rgba(255,190,90,.20);
    display:flex; gap:16px; align-items:center; justify-content:center;
  }
  .wheel-box{ position:relative; width:var(--wsz); height:var(--wsz); flex:none; }
  /* 外圈金框 */
  .wheel-rim{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 50% 22%, rgba(255,255,255,.5), rgba(255,255,255,0) 55%),
      linear-gradient(148deg,#ffeeb4,#e3a814 38%,#a96d07 66%,#ffdc86);
    box-shadow:0 10px 30px rgba(0,0,0,.55), inset 0 0 14px rgba(0,0,0,.4);
  }
  .wheel-bulb{
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:#fffdf0; box-shadow:0 0 7px 2px rgba(255,235,150,.95);
    transform:translate(-50%,-50%);
  }
  .wheel-dash{
    position:absolute; width:7px; height:15px; border-radius:4px;
    transform:translate(-50%,-50%) rotate(var(--rot));
    opacity:.95;
  }
  /* 轉盤本體 */
  .wheel-disc{
    position:absolute; inset:26px; border-radius:50%; overflow:hidden;
    box-shadow:inset 0 0 30px rgba(0,0,0,.4);
    transition:transform 4.2s cubic-bezier(.12,.86,.2,1);
  }
  .wheel-disc::after{           /* 分隔白線 */
    content:""; position:absolute; inset:0; border-radius:50%;
    background:repeating-conic-gradient(from -1.2deg,
      rgba(255,255,255,.92) 0deg 2.4deg, rgba(255,255,255,0) 2.4deg 36deg);
  }
  .wheel-lbl{ position:absolute; left:50%; top:50%; transform-origin:0 0; z-index:2; }
  .wheel-lbl .amt{
    display:block; font-size:26px; font-weight:900; color:#fff;
    letter-spacing:1px; white-space:nowrap;
    text-shadow:0 2px 0 rgba(0,0,0,.45), 0 0 8px rgba(0,0,0,.35);
  }
  .wheel-lbl img{ display:block; width:34px; margin:3px auto 0;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  /* 中央紅寶石 */
  .wheel-hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:96px; height:96px; border-radius:50%; z-index:4;
    background:linear-gradient(145deg,#ffeeb4,#dfa412 45%,#a76b06);
    box-shadow:0 4px 14px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
  }
  .wheel-hub i{
    width:52px; height:52px; display:block;
    background:radial-gradient(circle at 38% 30%, #ff9d9d, #e01f2d 45%, #8a0713);
    clip-path:polygon(50% 0,88% 22%,100% 62%,50% 100%,0 62%,12% 22%);
    box-shadow:inset 0 2px 6px rgba(255,255,255,.55);
  }
  /* 上方指針 */
  .wheel-ptr{
    position:absolute; left:50%; top:4px; transform:translateX(-50%); z-index:6;
    width:0; height:0; border-left:19px solid transparent; border-right:19px solid transparent;
    border-top:34px solid #e01f2d;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));
  }
  .wheel-ptr::after{
    content:""; position:absolute; left:-11px; top:-30px;
    width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%, #fff, #ffd54a 50%, #c98700);
    box-shadow:0 2px 5px rgba(0,0,0,.5);
  }
  /* 右側獎金階梯 */
  .jack{ display:flex; flex-direction:column; gap:10px; min-width:216px; }
  .jack-t{
    font-size:23px; font-weight:900; letter-spacing:4px; text-align:center;
    text-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 10px rgba(0,0,0,.4);
  }
  .jack-v{
    margin-top:1px; padding:3px 10px; border-radius:10px;
    background:linear-gradient(180deg,#141a33,#080b18);
    border:2px solid var(--jc);
    color:#ffe27a; font-size:20px; font-weight:bold; text-align:center;
    white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .jack-v img{ width:20px; display:block; }
  /* 抽獎按鈕 */
  .wheel-stage .spin-btn{
    width:84px; height:84px; border-radius:50%; flex:none; cursor:pointer;
    border:3px solid #7a4a00;
    background:linear-gradient(180deg,#ffe徴,#e0a400);
    background:linear-gradient(180deg,#ffe98a,#e0a400);
    color:#5a3d00; font-size:54px; font-weight:bold; line-height:1;
    box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .wheel-stage .spin-btn:hover{ filter:brightness(1.1); transform:translateY(-2px); }
  .wheel-stage .spin-btn:disabled{ filter:grayscale(.7); cursor:default; transform:none; }
  .wheel-hint{ color:#ffdfa8; font-size:16px; font-weight:bold; letter-spacing:2px; }

  /* ===== 彈窗 / Toast ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff; border:4px solid var(--ink); border-radius:14px;
    width:min(420px,90%); padding:22px 24px; text-align:center;
  }
  .modal h2{ font-size:20px; margin-bottom:12px; letter-spacing:2px; }
  .modal p{ font-size:15px; line-height:1.7; color:#333; margin-bottom:16px; text-align:left; }
  .modal .row{ display:flex; gap:12px; justify-content:center; }
  .modal button{
    padding:8px 26px; border-radius:18px; border:2px solid var(--ink);
    font-size:15px; font-weight:bold; cursor:pointer; letter-spacing:2px;
  }
  .m-ok{ background:#42c2ec; color:#083a4d; }
  .m-danger{ background:#e04b6f; color:#fff; }
  .m-cancel{ background:#eee; }
  .modal.wide{ width:min(780px,94%); }
  .modal.full{ width:min(1100px,96%); }

  #toastBox{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px; z-index:99; pointer-events:none;
  }
  .toast{
    background:rgba(20,28,50,.92); color:#fff;
    padding:9px 22px; border-radius:20px; font-size:14px; font-weight:bold;
    animation:tin .25s, tout .4s 2.2s forwards;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  @keyframes tin{ from{ opacity:0; transform:translateY(-12px);} }
  @keyframes tout{ to{ opacity:0; transform:translateY(-12px);} }

  #reopen{
    display:none; padding:14px 34px; font-size:18px; font-weight:bold;
    border-radius:26px; border:3px solid #fff; background:#42c2ec; color:#083a4d;
    cursor:pointer; letter-spacing:3px;
  }

  /* RWD */
  @media (max-width:900px){
    .tasks{ grid-template-columns:1fr; }
    .pass-body{ grid-template-columns:70px 1fr 130px; }
    .label-cell{ font-size:18px; letter-spacing:2px; }
    .pass-head{ grid-template-columns:1fr; text-align:center; }
    .deadline{ text-align:center; }
  }
</style>

<div class="window" id="win">

  <!-- 主體：標籤欄 + 可滑動軌道 + 固定大獎欄 -->

    <button class="btn btn-claimall" onclick="claimAll()">全部領取</button>

  </div>

  <!-- 每日任務 -->

<script>
/* =========================================================
   狀態機：任務 → EXP → 升級 → 解鎖獎勵 → 領取
   中間軌道 = Lv.1~49（一般獎勵）
   右方固定大獎欄 = Lv.10/20/30/40/50 轉盤（頁籤切換）
   ========================================================= */
const LEVEL_EXP = 200;
const MAX_LEVEL = 50;
const MILESTONES = [10,20,30,40,50];

const state = {
  exp: 0,
  level: 0,
  lux: false,
  bigTab: 10,          // 大獎欄目前顯示哪一階（隨畫面捲動自動更新）
  tasks: [
    { desc:"在大廳領取1次銅幣",              cur:0, max:1,  exp:100, claimed:false, size:24 },
    { desc:"完成每日挖寶2次",                cur:1, max:2,  exp:150, claimed:false, size:24 },
    { desc:"於魚機區單局至少<br>20倍得分10次", cur:0, max:10, exp:150, claimed:false },
  ],
  claimed: {},   // "free-3" / "lux1-3" / "lux2-3" / "wheelF-10" / "wheelL-10"
  bag: {},        // 背包：{ 物品名: 數量 }（轉盤類）
  mail: [],       // 信箱：[{icon,name,src,time}]
  mailUnread: 0,  // 未讀數（紅點）
};

/* ---------- 每日任務 ---------- */
function renderTasks(){
  const box = document.getElementById("tasks");
  box.innerHTML = state.tasks.map((t,i)=>{
    const pct = Math.min(100, t.cur/t.max*100);
    let btn;
    if(t.claimed)            btn = `<button class="go done">已完成</button>`;
    else if(t.cur >= t.max)  btn = `<button class="go claim" onclick="claimTask(${i})">領取</button>`;
    else                     btn = `<button class="go" onclick="progressTask(${i})">前往</button>`;
    return `
      <div class="task">
        <div class="gem">${t.exp}<span class="unit">EXP</span></div>
        <div class="task-main">
          <div class="desc">${t.desc}</div>
          <div class="bar-row">
            <div class="bar">
              <div class="fill" style="width:${pct}%"></div>
              <div class="txt">${t.cur}/${t.max}</div>
            </div>
          </div>
          ${btn}
        </div>
      </div>`;
  }).join("");
}
function progressTask(i){
  const t = state.tasks[i];
  if(t.cur < t.max){ t.cur++; toast(`任務進度 +1（${t.cur}/${t.max}）`); }
  renderTasks();
}
function claimTask(i){
  const t = state.tasks[i];
  t.claimed = true;
  addExp(t.exp);
  toast(`任務完成！獲得 ${t.exp} EXP`);
  renderTasks();
}

/* ---------- EXP / 升級 ---------- */
function addExp(v){
  if(state.lux) v = Math.round(v * 1.5);
  state.exp += v;
  let leveled = false;
  while(state.exp >= LEVEL_EXP && state.level < MAX_LEVEL){
    state.exp -= LEVEL_EXP; state.level++; leveled = true;
    toast(`🎉 通行證升級！Lv.${state.level}`);
  }
  if(state.level >= MAX_LEVEL) state.exp = Math.min(state.exp, LEVEL_EXP);
  renderAll();
  if(leveled) setTimeout(()=>scrollToLevel(state.level), 200);
}
let _lastLv = 0;
function renderExp(){
  document.getElementById("expFill").style.width =
    (state.level >= MAX_LEVEL ? 100 : state.exp/LEVEL_EXP*100) + "%";
  document.getElementById("expVal").textContent =
    state.level >= MAX_LEVEL ? "MAX" : `${state.exp}/${LEVEL_EXP}`;
  const badge = document.getElementById("lvBadge");
  badge.textContent = `Lv.${state.level}`;
  if(state.level !== _lastLv){
    badge.classList.remove("bump");
    void badge.offsetWidth;      // 重新觸發動畫
    badge.classList.add("bump");
    _lastLv = state.level;
  }
}

  if(slot === "wheelF") return F.big ? {id:F.big, n:1} : (F.slots[0] || null);
  if(slot === "wheelL") return L.big ? {id:L.big, n:1} : (L.slots[0] || null);
  return null;
}
/* 中間軌道顯示的階段：1~50 全含，里程碑階以加寬欄位呈現 */
const TRACK_LEVELS = Array.from({length:50}, (_,i)=>i+1);
const isMilestone = lv => MILESTONES.includes(lv);

/* ---------- 中間軌道（Lv.1~49） ---------- */
function rewardCell(key, label, cls, lv){
  const isLux = key.startsWith("lux") || key.startsWith("wheelL");
  const locked = isLux && !state.lux;
  const claimed = !!state.claimed[key];
  let c = `reward ${cls}`;
  if(claimed) c += " claimed";
  else if(state.level >= lv && !locked) c += " claimable";
  else if(locked || state.level < lv) c += " locked";
  return `<div class="${c}" onclick="claimReward('${key}',${lv})">${label}</div>`;
}

function renderTrack(){
  const track = document.getElementById("track");
  const cell = (key, cls, lv) => {
    const s = slotOf(key);
    return s ? rewardCell(key, slotHTML(s), cls, lv) : `<div class="reward empty"></div>`;
  };
  let html = "";
  for(const lv of TRACK_LEVELS){
    const body = isMilestone(lv)
      ? `<div class="cell-free">${cell(`wheelF-${lv}`,"wheel-free",lv)}</div>
         <div class="cell-lux">
           ${cell(`wheelL-${lv}`,"wheel-lux",lv)}
           <div class="reward empty"></div>
         </div>`
      : `<div class="cell-free">${cell(`free-${lv}`,"free",lv)}</div>
         <div class="cell-lux">
           ${cell(`lux1-${lv}`,"lux",lv)}
           ${cell(`lux2-${lv}`,"lux",lv)}
         </div>`;
    html += `
      <div class="col ${isMilestone(lv)?"milestone":""}" data-lv="${lv}">
        ${body}
        <div class="node ${state.level>=lv?"reached":""}">${lv}</div>
      </div>`;
  }
  html += `<div class="rail"><div class="rail-fill" id="railFill"></div></div>`;
  track.innerHTML = html;
  const rf = document.getElementById("railFill");
  if(rf) rf.style.width = Math.min(100, state.level / TRACK_LEVELS.length * 100) + "%";
}

/* ---------- 右方固定大獎欄 ---------- */
/* 右側固定欄：顯示「下一個還沒達到的里程碑」
   （Lv.0~9 → 10、Lv.10~19 → 20、…、Lv.50 → 50）
   里程碑階本身仍會排在中間軌道上，兩邊共用同一個 key 所以領取狀態同步 */
function nextMilestone(){
  return MILESTONES.find(m => m > state.level) || MILESTONES[MILESTONES.length - 1];
}
function renderBigCol(){
  const box = document.getElementById("bigCol");
  if(!box) return;
  const lv = state.bigTab = nextMilestone();
  const cell = (key, cls) => {
    const s = slotOf(key);
    return s ? rewardCell(key, slotHTML(s), cls, lv) : `<div class="reward empty"></div>`;
  };
  box.innerHTML = `
    <div class="cell-free">${cell(`wheelF-${lv}`,"wheel-free")}</div>
    <div class="cell-lux">
      ${cell(`wheelL-${lv}`,"wheel-lux")}
      <div class="ad-copy">
        <span class="l1">轉動轉盤</span>
        <span class="l2">星幣<b>滾滾入袋</b></span>
      </div>
    </div>
    <div class="big-node ${state.level>=lv?"reached":""}">${lv}</div>`;
}

/* ---------- 大獎欄跟隨畫面：依可視範圍最右邊的階段決定 ----------
   畫面顯示 1~6  → 最右 6  → 下一個里程碑 10
   畫面顯示 11~17 → 最右 17 → 下一個里程碑 20              */

/* ---------- 領取獎勵（跳出領取畫面 → 按確認入帳） ---------- */
function claimReward(key, lv){
  if(state.claimed[key]) return;
  const isLux = key.startsWith("lux") || key.startsWith("wheelL");
  if(isLux && !state.lux){ toast("🔒 需購買豪華通行證才能領取"); return; }
  if(state.level < lv){ toast(`🔒 需達到 Lv.${lv} 才能領取`); return; }

  // 獎勵名稱與圖示
  const isWheel = key.startsWith("wheel");

  const sl = slotOf(key);
  if(!sl) return;
  name = slotLabel(sl);
  const src = iconOf(sl.id);
  icon = src ? `<img src="${src}" style="width:76px;height:auto;vertical-align:middle;">`
             : KEY_ICON_FALLBACK;

  // 領取畫面
  modal(`
    <h2>${isWheel ? "🏆 里程碑大獎" : "獲得獎勵"}</h2>

    <p style="text-align:center; font-size:17px; margin-bottom:4px;">

    </p>

      按下確認後獎勵將發送至你的帳戶
    </p>
    <div class="row">
      <button class="m-ok" onclick="confirmClaim('${key}',${lv})">確 認</button>
    </div>`);
}
function confirmClaim(key, lv){
  state.claimed[key] = true;
  closeModal();
  deliverReward(key);
  renderTrack(); renderBigCol();
}
/* 依 key 決定入帳方式：轉盤 → 背包；其他 → 信箱 */
function deliverReward(key){
  const sl = slotOf(key);
  if(!sl) return;
  if(key.startsWith("wheel")){ addToBag(sl.id); toast(`🎁 ${sl.id} 已放入背包`); }
  else { sendMail(sl.id, slotLabel(sl), "通行證獎勵"); toast(`📬 ${slotLabel(sl)} 已寄至信箱`); }
}

/* ---------- 全部領取（跳出領取畫面 → 按確認入帳） ---------- */
function collectClaimable(){
  const list = [];
  const push = (k, lv, name)=>{
    const isLux = k.startsWith("lux") || k.startsWith("wheelL");
    if(isLux && !state.lux) return;
    if(!state.claimed[k]) list.push({ key:k, lv, name });
  };
  const put = (k, lv) => { const sl = slotOf(k); if(sl) push(k, lv, slotLabel(sl)); };
  for(const lv of TRACK_LEVELS){
    if(lv > state.level) break;
    if(isMilestone(lv)){ put(`wheelF-${lv}`, lv); put(`wheelL-${lv}`, lv); }
    else { put(`free-${lv}`, lv); put(`lux1-${lv}`, lv); put(`lux2-${lv}`, lv); }
  }
  return list;
}
/* 全部領取彈窗用的圖示：直接取 ICON 表（名稱含數量 → 以品項名開頭比對） */
function metaImg(name){
  const id = Object.keys(ICON).find(k => name.startsWith(k));
  return id ? `<img src="${ICON[id]}" style="width:56px;height:auto;">`
            : `<span style="font-size:34px;">${KEY_ICON_FALLBACK}</span>`;
}
function groupRewards(list){
  const g = {};
  list.forEach(r => { g[r.name] = (g[r.name] || 0) + 1; });
  return Object.entries(g);   // [[name, count], ...]
}
function claimAll(){
  const list = collectClaimable();
  if(!list.length){ toast("目前沒有可領取的獎勵"); return; }
  const items = groupRewards(list).map(([name, n]) => `
    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;
                background:#f2f6fb; border:2px solid #c9d4e2; border-radius:10px;
                padding:8px 10px; min-width:86px;">
      ${metaImg(name)}
      <span style="font-size:13px; font-weight:bold;">${name}</span>
      <span style="font-size:14px; font-weight:bold; color:#1a9fd9;">× ${n}</span>
    </div>`).join("");
  modal(`
    <h2>獲得獎勵</h2>
    <p style="text-align:center; font-size:16px; margin-bottom:8px;">
      共 <b>${list.length}</b> 項獎勵
    </p>
    <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:10px;">
      ${items}
    </div>
    <p style="text-align:center; color:#666; font-size:13px;">
      按下確認後獎勵將發送至你的帳戶
    </p>
    <div class="row">
      <button class="m-ok" onclick="confirmClaimAll()">確 認</button>
    </div>`);
}
function confirmClaimAll(){
  const list = collectClaimable();
  let toBag = 0, toMail = 0;
  list.forEach(r => {
    state.claimed[r.key] = true;
    const sl = slotOf(r.key);

function addToBag(name){ state.bag[name] = (state.bag[name] || 0) + 1; }

function sendMail(icon, name, src){

let _bagSel = null;
function openBag(sel){

/* ---------- 10 格轉盤（參考遊戲內轉盤介面） ---------- */
/* 權重 = 數量；兩個獎池皆為星幣
   普通轉盤：最高 3,000 星幣　豪華轉盤：最高 100,000 星幣 */
const WHEEL_PRIZES = {
  free: [
    {amount:3000, weight:1},    {amount:2000, weight:3},    {amount:1500, weight:6},
    {amount:1000, weight:50},   {amount:500,  weight:100},  {amount:300,  weight:140},
    {amount:200,  weight:200},  {amount:150,  weight:500},  {amount:100,  weight:1000},
    {amount:50,   weight:3000},
  ],
  lux: [
    {amount:100000, weight:1},   {amount:10000, weight:3},   {amount:5000, weight:6},
    {amount:3000,   weight:10},  {amount:1500,  weight:20},  {amount:1000, weight:30},
    {amount:500,    weight:280}, {amount:300,   weight:350}, {amount:200,  weight:200},
    {amount:100,    weight:100},
  ],
};
Object.values(WHEEL_PRIZES).forEach(list =>
  list.forEach(p => { p.icon = "星幣"; p.name = `星幣 ×${p.amount.toLocaleString()}`; }));

/* 5,000 → 5K；1,500 → 1.5K */
function shortNum(n){
  if(n >= 1000){
    const k = n / 1000;
    return (Number.isInteger(k) ? k : k.toFixed(1)) + "K";
  }
  return String(n);
}
function pickWeighted(prizes){
  const total = prizes.reduce((a,p) => a + p.weight, 0);
  let r = Math.random() * total;
  for(let i = 0; i < prizes.length; i++){
    r -= prizes[i].weight;
    if(r < 0) return i;
  }
  return prizes.length - 1;
}
let _spinning = false;
const WHEEL_COLORS = ["#e5342a","#f5a413","#f2d011","#63bd18","#12b07a",
                      "#17b3d4","#2470dc","#6b3fd6","#c22fb8","#ec2f7a"];
const RIM_DASH   = ["#63bd18","#8a4ad8","#f2d011","#17b3d4","#ec2f7a","#f5a413"];
const JACK = [
  {t:"GRAND", c:"#ffd54a", b:"#ffb400"},
  {t:"MAJOR", c:"#d69bff", b:"#8a4ad8"},
  {t:"MINOR", c:"#8fd0ff", b:"#2470dc"},
  {t:"MINI",  c:"#a9ec7a", b:"#4aa81f"},
];

function openWheel(type, itemName){
  const prizes = WHEEL_PRIZES[type];
  const N = prizes.length, STEP = 360 / N;
  const coin = ICON["星幣"];

  // 扇形底色
  const segs = WHEEL_COLORS.map((c,i) => `${c} ${i*STEP}deg ${(i+1)*STEP}deg`).join(",");

  // 獎項文字（沿半徑排列）
  const labels = prizes.map((p,i) => `
    <div class="wheel-lbl" style="transform:rotate(${i*STEP + STEP/2}deg) translateY(-186px);">
      <div style="transform:translateX(-50%); text-align:center;">
        <span class="amt">${shortNum(p.amount)}</span>
        <img src="${coin}" alt="星幣">
      </div>
    </div>`).join("");

  // 外圈燈泡與色塊
  let rim = "";
  for(let i = 0; i < 28; i++){
    const a = i * (360/28) - 90, r = 48.6;
    const x = 50 + r * Math.cos(a*Math.PI/180), y = 50 + r * Math.sin(a*Math.PI/180);
    rim += `<span class="wheel-bulb" style="left:${x}%; top:${y}%;"></span>`;
  }
  for(let i = 0; i < 12; i++){
    const a = i * 30 - 75, r = 43.4;
    const x = 50 + r * Math.cos(a*Math.PI/180), y = 50 + r * Math.sin(a*Math.PI/180);
    rim += `<span class="wheel-dash" style="left:${x}%; top:${y}%; --rot:${a+90}deg;
             background:${RIM_DASH[i % RIM_DASH.length]};"></span>`;
  }

  // 右側獎金階梯（取獎池前 4 大獎）
  const ladder = JACK.map((j,i) => {
    const p = prizes[i];
    return `<div>
      <div class="jack-t" style="color:${j.c};">${j.t}</div>
      <div class="jack-v" style="--jc:${j.b};"><img src="${coin}" alt="">${p.amount.toLocaleString()}</div>
    </div>`;
  }).join("");

  modal(`
    <h2 style="font-size:28px; margin-bottom:10px;">${itemName}</h2>
    <div class="wheel-stage">
      <div class="wheel-box">
        <div class="wheel-rim"></div>
        ${rim}
        <div class="wheel-ptr"></div>
        <div id="wheelDisc" class="wheel-disc" style="background:conic-gradient(${segs});">
          ${labels}
        </div>
        <div class="wheel-hub"><i></i></div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
        <div class="jack">${ladder}</div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel('${type}')" title="開始抽獎">
          <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
            <path d="M24 8a16 16 0 1 1-13.9 8" fill="none" stroke="#5a3d00"
                  stroke-width="7" stroke-linecap="round"/>
            <path d="M24 1.5 L24 14.5 L13 8 Z" fill="#5a3d00"/>
          </svg>
        </button>
        <div class="wheel-hint" id="wheelResult">按下按鈕開始抽獎</div>
      </div>
    </div>`, "full");
}

function spinWheel(type){
  if(_spinning) return;
  _spinning = true;
  const btn = document.getElementById("spinBtn");
  if(btn) btn.disabled = true;
  const prizes = WHEEL_PRIZES[type];
  const N = prizes.length, STEP = 360 / N;
  const idx = pickWeighted(prizes);
  const disc = document.getElementById("wheelDisc");
  // 指針在正上方：讓中獎格中心轉到 0 度
  const deg = 5*360 + (360 - (idx*STEP + STEP/2));
  disc.style.transform = `rotate(${deg}deg)`;
  setTimeout(()=>{
    _spinning = false;
    const p = prizes[idx];
    const res = document.getElementById("wheelResult");
    if(res) res.innerHTML = `🎉 獲得 <b style="color:#ffe27a;">${p.name}</b><br>已寄至信箱`;
    sendMail(p.icon, p.name, type === "free" ? "普通轉盤" : "豪華轉盤");
    const b = document.getElementById("spinBtn");
    if(b){ b.disabled = false; b.textContent = "✓"; b.onclick = closeModal; b.title = "完成"; }
  }, 4300);
}

    <div style="display:flex; align-items:center; gap:10px; background:#f2f6fb;
         border:2px solid #c9d4e2; border-radius:10px; padding:8px 12px;">
      ${ICON[m.icon] ? `<img src="${ICON[m.icon]}" style="width:34px;">` : `<span style="font-size:30px;">${m.icon}</span>`}
      <div style="flex:1; text-align:left;">
        <div style="font-weight:bold; font-size:15px;">${m.name}</div>
        <div style="font-size:12px; color:#667;">來源：${m.src}｜${m.time}</div>
      </div>
    </div>`).join("")
    : `<div style="color:#889; font-size:14px; padding:30px 0;">信箱是空的</div>`;
  modal(`
    <h2>📬 信箱</h2>
    <div style="display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; margin-bottom:12px;">
      ${rows}
    </div>
    <div class="row"><button class="m-ok" onclick="closeModal()">關 閉</button></div>`);
}

/* ---------- 金手指 ---------- */
function cheatLevel(d){
  const inp = document.getElementById("cheatLv");
  inp.value = Math.max(0, Math.min(MAX_LEVEL, (parseInt(inp.value)||0) + d));
  cheatSet();
}
function cheatSet(){
  const inp = document.getElementById("cheatLv");
  const lv = Math.max(0, Math.min(MAX_LEVEL, parseInt(inp.value)||0));
  inp.value = lv;
  state.level = lv; state.exp = 0;
  toast(`🕹️ 金手指：等級設為 Lv.${lv}`);
  renderAll();
  setTimeout(()=>scrollToLevel(Math.max(1,lv)), 150);
}

/* ---------- 捲動 ---------- */
function scrollToLevel(lv){
  const scroller = document.getElementById("trackScroll");
  const col = document.querySelector(`.track .col[data-lv="${lv}"]`);
  if(!scroller || !col) return;
  const target = col.offsetLeft - scroller.clientWidth/2 + col.clientWidth/2;
  scroller.scrollTo({ left:Math.max(0,target), behavior:"smooth" });
}

/* ---------- 手機式滑動：滑鼠拖曳 + 放手慣性 ----------
   （觸控裝置本身就支援滑動，這段讓桌機滑鼠也有一樣手感） */
(function enableDragScroll(){
  const el = document.getElementById("trackScroll");
  let down = false, startX = 0, startScroll = 0;
  let lastX = 0, lastT = 0, velocity = 0, rafId = null;

  el.addEventListener("mousedown", e=>{
    down = true;
    cancelAnimationFrame(rafId);
    startX = e.pageX; startScroll = el.scrollLeft;
    lastX = e.pageX; lastT = performance.now(); velocity = 0;
    el.classList.remove("dragging"); // 先不鎖點擊，移動超過門檻才算拖曳
  });
  window.addEventListener("mousemove", e=>{
    if(!down) return;
    const dx = e.pageX - startX;
    if(Math.abs(dx) > 5) el.classList.add("dragging");
    el.scrollLeft = startScroll - dx;
    // 記錄速度（px/ms）供慣性用
    const now = performance.now();
    velocity = (e.pageX - lastX) / Math.max(1, now - lastT);
    lastX = e.pageX; lastT = now;
  });
  window.addEventListener("mouseup", ()=>{
    if(!down) return;
    down = false;
    // 慣性滑動：速度衰減
    let v = -velocity * 16;              // 換算成每幀位移
    const decay = ()=>{
      if(Math.abs(v) < 0.5){ el.classList.remove("dragging"); return; }
      el.scrollLeft += v;
      v *= 0.94;
      rafId = requestAnimationFrame(decay);
    };
    rafId = requestAnimationFrame(decay);
    setTimeout(()=>el.classList.remove("dragging"), 50);
  });
  el.addEventListener("mouseleave", ()=>{ /* 拖出範圍交給 window 事件收尾 */ });

  // 捲動時（拖曳、觸控、慣性都會觸發）→ 更新右側大獎欄
  let scrollRaf = null;
  el.addEventListener("scroll", ()=>{
    if(scrollRaf) return;
    scrollRaf = requestAnimationFrame(()=>{
      scrollRaf = null;
      updateBigTabByView();
    });
  }, { passive:true });
})();

/* ---------- 彈窗 / Toast ---------- */
function modal(html, size){
  const m = document.getElementById("modalBody");
  m.innerHTML = html;
  m.classList.toggle("wide", size === "wide");
  m.classList.toggle("full", size === "full");
  document.getElementById("overlay").classList.add("show");
}
function closeModal(){ document.getElementById("overlay").classList.remove("show"); }
document.getElementById("overlay").addEventListener("click", e=>{
  if(e.target.id === "overlay") closeModal();
});
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.getElementById("toastBox").appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

/* ---------- 倒數計時 ---------- */
const END = new Date("2026-07-17T23:59:00+08:00").getTime();
function tick(){
  const d = END - Date.now();
  const el = document.getElementById("countdown");
  if(d <= 0){ el.textContent = ""; return; }   /* 結束就不顯示文字 */
  const day = Math.floor(d/86400000),
        h   = Math.floor(d/3600000)%24,
        m   = Math.floor(d/60000)%60,
        s   = Math.floor(d/1000)%60;
  el.textContent = `⏰ 剩餘 ${day} 天 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
setInterval(tick, 1000);

/* ---------- 統一重繪 ---------- */
/* 標籤欄的豪華解鎖狀態 */
function renderLabelState(){
  const col = document.querySelector(".label-col");
  if(!col) return;
  col.classList.toggle("unlocked", !!state.lux);
}
function renderAll(){
  renderExp(); renderTrack(); renderBigCol(); renderLabelState();
  updateBigTabByView();   // 依目前畫面位置校正大獎欄
}

/* ---------- 初始化 ---------- */
renderTasks(); renderAll(); tick();
